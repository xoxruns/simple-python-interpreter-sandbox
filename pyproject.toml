[project]
name = "python-sandbox-client"
dynamic = ["version"]
description = "Asyncio client for the Deno/Pyodide stdio Python sandbox worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_sandbox_client"]
artifacts = ["python_sandbox_client/bin/**"]

[tool.hatch.version]
source = "vcs"